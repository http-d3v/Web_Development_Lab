<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360">
  <rect width="600" height="360" rx="10" fill="#F4EFE6" stroke="#E7DECF" stroke-width="2"/>
  <!-- Top bar -->
  <rect x="0" y="0" width="600" height="36" rx="10" fill="#EFE8DC"/>
  <circle cx="24" cy="18" r="5" fill="#D2C4B0"/>
  <circle cx="40" cy="18" r="5" fill="#D2C4B0"/>
  <circle cx="56" cy="18" r="5" fill="#D2C4B0"/>
  <rect x="80" y="9" width="300" height="18" rx="4" fill="#FFFFFF" stroke="#E7DECF"/>
  <text x="95" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#8F827A">hostel-project-rho.vercel.app</text>

  <!-- Banner -->
  <rect x="40" y="60" width="520" height="70" rx="6" fill="#FFFFFF" stroke="#E7DECF"/>
  <!-- Database icon -->
  <ellipse cx="75" cy="82" rx="18" ry="6" fill="#B88338"/>
  <path d="M57 82 v12 c0 3.3 8 6 18 6 s18 -2.7 18 -6 v-12 Z" fill="#B88338" opacity="0.85"/>
  <path d="M57 94 v12 c0 3.3 8 6 18 6 s18 -2.7 18 -6 v-12 Z" fill="#B88338" opacity="0.7"/>

  <text x="110" y="88" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="700" fill="#2C2522">Hostel Room Allocation System</text>
  <text x="110" y="110" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#655953">MySQL 8.0 &bull; Relational Schema &bull; Stored Procedures &amp; Automated Triggers</text>

  <!-- Code / Architecture Box -->
  <rect x="40" y="150" width="520" height="170" rx="6" fill="#25201D"/>
  <text x="60" y="180" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#D5C7BC">-- MySQL 8.0 Automated Trigger: prevent_room_overallocation</text>
  <text x="60" y="202" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#B88338">DELIMITER $$</text>
  <text x="60" y="224" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#F4EFE6">CREATE TRIGGER <tspan fill="#A25E3E">before_student_room_assign</tspan></text>
  <text x="60" y="246" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#F4EFE6">BEFORE INSERT ON allocations FOR EACH ROW</text>
  <text x="60" y="268" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#F4EFE6">BEGIN</text>
  <text x="80" y="290" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#5CD08B">  IF get_available_beds(NEW.room_id) &lt;= 0 THEN</text>
  <text x="100" y="306" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#FF7B7B">    SIGNAL SQLSTATE '45000' SET MESSAGE_TEXT = 'Capacity Full';</text>
</svg>
