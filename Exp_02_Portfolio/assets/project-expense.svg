<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <rect width="400" height="240" fill="#F4EFE6"/>
  <!-- App Container -->
  <rect x="24" y="20" width="352" height="200" rx="10" fill="#FDFBF7" stroke="#E2D7C8" stroke-width="2"/>
  <!-- Top Bar -->
  <rect x="24" y="20" width="352" height="32" rx="10" fill="#EDE4D5"/>
  <rect x="24" y="42" width="352" height="10" fill="#EDE4D5"/>
  <circle cx="44" cy="36" r="4.5" fill="#D36B50"/>
  <circle cx="58" cy="36" r="4.5" fill="#DDB258"/>
  <circle cx="68" cy="36" r="4.5" fill="#6B9075"/>
  <text x="200" y="40" font-family="system-ui, sans-serif" font-size="11" fill="#655953" text-anchor="middle" font-weight="600">Finance &amp; Budget Tracker</text>

  <!-- Left Stats Card -->
  <rect x="44" y="68" width="146" height="58" rx="6" fill="#F4EFE6" stroke="#E2D7C8"/>
