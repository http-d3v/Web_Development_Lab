  <text x="56" y="110" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#2C2522">₹ 14,250</text>

  <!-- Right Chart/Graph preview -->
  <rect x="206" y="68" width="150" height="58" rx="6" fill="#F4EFE6" stroke="#E2D7C8"/>
  <!-- Bar chart bars -->
  <rect x="220" y="100" width="12" height="18" rx="2" fill="#A25E3E"/>
  <rect x="240" y="88" width="12" height="30" rx="2" fill="#48604F"/>
  <rect x="260" y="94" width="12" height="24" rx="2" fill="#DDB258"/>
  <rect x="280" y="82" width="12" height="36" rx="2" fill="#A25E3E"/>
  <rect x="300" y="90" width="12" height="28" rx="2" fill="#48604F"/>
  <rect x="320" y="78" width="12" height="40" rx="2" fill="#2C2522"/>

  <!-- Transaction List rows -->
  <rect x="44" y="138" width="312" height="22" rx="4" fill="#FFFFFF" stroke="#EAE2D5"/>
  <circle cx="56" cy="149" r="5" fill="#48604F"/>
  <text x="68" y="153" font-family="system-ui, sans-serif" font-size="10" fill="#2C2522">Monthly Fellowship / Stipend</text>
  <text x="340" y="153" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#48604F" text-anchor="end">+₹ 8,000</text>

  <rect x="44" y="166" width="312" height="22" rx="4" fill="#FFFFFF" stroke="#EAE2D5"/>
  <circle cx="56" cy="177" r="5" fill="#A25E3E"/>
  <text x="68" y="181" font-family="system-ui, sans-serif" font-size="10" fill="#2C2522">Textbooks &amp; Stationery</text>
  <text x="340" y="181" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#A25E3E" text-anchor="end">-₹ 1,240</text>

  <rect x="44" y="194" width="312" height="20" rx="4" fill="#FFFFFF" stroke="#EAE2D5"/>
  <circle cx="56" cy="204" r="5" fill="#A25E3E"/>
  <text x="68" y="208" font-family="system-ui, sans-serif" font-size="10" fill="#2C2522">Hostel Mess Dues</text>
  <text x="340" y="208" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#A25E3E" text-anchor="end">-₹ 3,500</text>
