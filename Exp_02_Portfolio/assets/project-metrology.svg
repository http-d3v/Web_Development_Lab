<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360">
  <rect width="600" height="360" rx="10" fill="#F4EFE6" stroke="#E7DECF" stroke-width="2"/>
  <!-- Top bar -->
  <rect x="0" y="0" width="600" height="36" rx="10" fill="#EFE8DC"/>
  <circle cx="24" cy="18" r="5" fill="#D2C4B0"/>
  <circle cx="40" cy="18" r="5" fill="#D2C4B0"/>
  <circle cx="56" cy="18" r="5" fill="#D2C4B0"/>
  <rect x="80" y="9" width="300" height="18" rx="4" fill="#FFFFFF" stroke="#E7DECF"/>
  <text x="95" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#8F827A">metrology3-xcuw.vercel.app</text>

  <!-- Banner -->
  <rect x="40" y="60" width="520" height="70" rx="6" fill="#FFFFFF" stroke="#E7DECF"/>
  <!-- Weighing balance icon -->
  <line x1="70" y1="78" x2="70" y2="114" stroke="#48604F" stroke-width="3"/>
  <line x1="52" y1="84" x2="88" y2="84" stroke="#48604F" stroke-width="2.5"/>
  <polyline points="52,84 46,102 58,102 52,84" fill="#F4EFE6" stroke="#48604F" stroke-width="1.5"/>
  <polyline points="88,84 82,102 94,102 88,84" fill="#F4EFE6" stroke="#48604F" stroke-width="1.5"/>

  <text x="110" y="88" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="700" fill="#2C2522">Metrology R76 Compliance</text>
  <text x="110" y="110" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#655953">Legal Metrology &amp; Non-Automatic Weighing Instrument Certification</text>

  <!-- Certification Table Preview -->
  <rect x="40" y="150" width="520" height="170" rx="6" fill="#FFFFFF" stroke="#E7DECF"/>
  <rect x="40" y="150" width="520" height="34" rx="6" fill="#EFE8DC"/>
  <text x="60" y="172" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#655953">SCALE MODEL</text>
  <text x="210" y="172" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#655953">ACCURACY CLASS</text>
  <text x="360" y="172" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#655953">ERROR MARGIN</text>
  <text x="470" y="172" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#655953">CERTIFICATE</text>

  <!-- Row 1 -->
  <text x="60" y="206" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#2C2522">Mettler Toledo Precision</text>
  <text x="210" y="206" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#2C2522">Class III (Medium)</text>
  <text x="360" y="206" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#48604F">&plusmn; 0.05 g [PASS]</text>
  <rect x="470" y="193" width="70" height="18" rx="3" fill="#EDF5F0"/>
  <text x="480" y="206" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#48604F">VERIFIED</text>

  <!-- Row 2 -->
  <text x="60" y="242" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#2C2522">CAS Retail Platform Scale</text>
  <text x="210" y="242" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#2C2522">Class III (Industrial)</text>
  <text x="360" y="242" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#48604F">&plusmn; 0.10 g [PASS]</text>
  <rect x="470" y="229" width="70" height="18" rx="3" fill="#EDF5F0"/>
  <text x="480" y="242" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#48604F">VERIFIED</text>

  <!-- Row 3 -->
  <text x="60" y="278" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#2C2522">Avery Weigh-Tronix</text>
  <text x="210" y="278" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#2C2522">Class II (Special)</text>
  <text x="360" y="278" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#B93826">&plusmn; 0.85 g [FAULTY]</text>
