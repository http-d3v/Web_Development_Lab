<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <rect width="400" height="240" fill="#F4EFE6"/>
  <!-- App Container -->
  <rect x="24" y="20" width="352" height="200" rx="10" fill="#FDFBF7" stroke="#E2D7C8" stroke-width="2"/>
  <!-- Top Bar -->
  <rect x="24" y="20" width="352" height="32" rx="10" fill="#EDE4D5"/>
  <rect x="24" y="42" width="352" height="10" fill="#EDE4D5"/>
  <circle cx="44" cy="36" r="4.5" fill="#D36B50"/>
  <circle cx="58" cy="36" r="4.5" fill="#DDB258"/>
  <circle cx="68" cy="36" r="4.5" fill="#6B9075"/>
  <text x="200" y="40" font-family="system-ui, sans-serif" font-size="11" fill="#655953" text-anchor="middle" font-weight="600">Central Library Book Catalog</text>

  <!-- Search input bar -->
  <rect x="44" y="66" width="312" height="26" rx="5" fill="#FFFFFF" stroke="#D8CDBE"/>
  <circle cx="58" cy="79" r="4" fill="none" stroke="#8C7D73" stroke-width="1.5"/>
  <line x1="61" y1="82" x2="66" y2="87" stroke="#8C7D73" stroke-width="1.5"/>
  <text x="74" y="83" font-family="system-ui, sans-serif" font-size="10" fill="#8C7D73">Search by title, author, ISBN or department...</text>

  <!-- Book Cards grid -->
  <!-- Book 1 -->
  <rect x="44" y="104" width="94" height="104" rx="5" fill="#F4EFE6" stroke="#E2D7C8"/>
  <rect x="52" y="112" width="78" height="52" rx="3" fill="#2C2522"/>
  <rect x="56" y="116" width="4" height="44" fill="#A25E3E"/>
  <text x="64" y="132" font-family="system-ui, sans-serif" font-size="7" fill="#FDFBF7" font-weight="700">DATA</text>
  <text x="64" y="142" font-family="system-ui, sans-serif" font-size="7" fill="#FDFBF7" font-weight="700">STRUCTURES</text>
  <text x="52" y="178" font-family="system-ui, sans-serif" font-size="8" font-weight="700" fill="#2C2522">CLRS Algorithms</text>
  <rect x="52" y="186" width="48" height="14" rx="2" fill="#DCE5DF"/>
  <text x="76" y="196" font-family="system-ui, sans-serif" font-size="7" fill="#2A4834" font-weight="600" text-anchor="middle">Available (4)</text>

  <!-- Book 2 -->
  <rect x="152" y="104" width="94" height="104" rx="5" fill="#F4EFE6" stroke="#E2D7C8"/>
  <rect x="160" y="112" width="78" height="52" rx="3" fill="#48604F"/>
  <rect x="164" y="116" width="4" height="44" fill="#DDB258"/>
  <text x="172" y="132" font-family="system-ui, sans-serif" font-size="7" fill="#FDFBF7" font-weight="700">OPERATING</text>
  <text x="172" y="142" font-family="system-ui, sans-serif" font-size="7" fill="#FDFBF7" font-weight="700">SYSTEMS</text>
  <text x="160" y="178" font-family="system-ui, sans-serif" font-size="8" font-weight="700" fill="#2C2522">Silberschatz OS</text>
  <rect x="160" y="186" width="48" height="14" rx="2" fill="#DCE5DF"/>
  <text x="184" y="196" font-family="system-ui, sans-serif" font-size="7" fill="#2A4834" font-weight="600" text-anchor="middle">Available (2)</text>

  <!-- Book 3 -->
  <rect x="260" y="104" width="94" height="104" rx="5" fill="#F4EFE6" stroke="#E2D7C8"/>
  <rect x="268" y="112" width="78" height="52" rx="3" fill="#A25E3E"/>
  <rect x="272" y="116" width="4" height="44" fill="#FDFBF7"/>
  <text x="280" y="132" font-family="system-ui, sans-serif" font-size="7" fill="#FDFBF7" font-weight="700">COMPUTER</text>
  <text x="280" y="142" font-family="system-ui, sans-serif" font-size="7" fill="#FDFBF7" font-weight="700">NETWORKS</text>
  <text x="268" y="178" font-family="system-ui, sans-serif" font-size="8" font-weight="700" fill="#2C2522">Tanenbaum 6th</text>
  <rect x="268" y="186" width="48" height="14" rx="2" fill="#F2DFDA"/>
  <text x="292" y="196" font-family="system-ui, sans-serif" font-size="7" fill="#84291B" font-weight="600" text-anchor="middle">Issued Out</text>
</svg>
